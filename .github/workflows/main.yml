name: Build GB28181DeviceSimulator

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build with MSBuild
      run: |
        cd GB28181DeviceSimulator
        msbuild GB28181DeviceSimulator.vcxproj `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:OutputPath=..\Release_x64

    - name: Copy runtime DLLs and configs
      run: |
        # 创建输出目录
        New-Item -ItemType Directory -Force -Path Release_x64
        
        # 从 lib 目录复制核心依赖 DLL
        Copy-Item lib\libEasyGBD.dll Release_x64\
        Copy-Item lib\libEasyStreamClient.dll Release_x64\
        Copy-Item lib\libEasyAACEncoder.dll Release_x64\
        Copy-Item lib\libeasyrtmp.dll Release_x64\
        Copy-Item lib\Logger.dll Release_x64\
        
        # 从根目录复制 FFmpeg 及其他运行时文件
        Copy-Item avcodec-58.dll Release_x64\
        Copy-Item avdevice-58.dll Release_x64\
        Copy-Item avfilter-7.dll Release_x64\
        Copy-Item avformat-58.dll Release_x64\
        Copy-Item avutil-56.dll Release_x64\
        Copy-Item postproc-55.dll Release_x64\
        Copy-Item swresample-3.dll Release_x64\
        Copy-Item swscale-5.dll Release_x64\
        Copy-Item concrt140.dll Release_x64\
        Copy-Item EasyDarwin.mp4 Release_x64\
        Copy-Item GBDeviceInfo.xml Release_x64\

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EasyGBDSimulator
        path: Release_x64/
