name: Build GB28181DeviceSimulator

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build with MSBuild
      run: |
        cd GB28181DeviceSimulator
        msbuild GB28181DeviceSimulator.vcxproj `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:OutputPath=..\Release_x64

    - name: Copy runtime DLLs and configs
      run: |
        # 创建输出目录
        New-Item -ItemType Directory -Force -Path Release_x64
        
        # 侦察：列出根目录和 lib 目录下的所有文件
        Write-Host "=== Files in root ==="
        Get-ChildItem -File | Select-Object Name
        Write-Host "=== Files in lib ==="
        if (Test-Path lib) { Get-ChildItem lib -File | Select-Object Name } else { Write-Host "lib directory not found" }
        
        # 尝试从常见位置复制 DLL，找不到就跳过不报错
        $dllFiles = @(
            "lib\libEasyGBD.dll",
            "lib\libEasyStreamClient.dll",
            "lib\libEasyAACEncoder.dll",
            "lib\libeasyrtmp.dll",
            "lib\Logger.dll",
            "avcodec-58.dll",
            "avdevice-58.dll",
            "avfilter-7.dll",
            "avformat-58.dll",
            "avutil-56.dll",
            "postproc-55.dll",
            "swresample-3.dll",
            "swscale-5.dll",
            "concrt140.dll"
        )
        
        foreach ($dll in $dllFiles) {
            if (Test-Path $dll) {
                Copy-Item $dll Release_x64\ -Force
                Write-Host "Copied: $dll"
            } else {
                Write-Host "WARNING: $dll not found, skipping"
            }
        }
        
        # 复制配置文件
        if (Test-Path EasyDarwin.mp4) { Copy-Item EasyDarwin.mp4 Release_x64\ }
        if (Test-Path GBDeviceInfo.xml) { Copy-Item GBDeviceInfo.xml Release_x64\ }    


    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EasyGBDSimulator
        path: Release_x64/
