name: Build GB28181DeviceSimulator

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build with MSBuild
      run: |
        # 进入真正的源码目录进行编译
        cd GB28181DeviceSimulator\GB28181DeviceSimulator
        msbuild GB28181DeviceSimulator.vcxproj `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:OutputPath=..\..\Release_x64

    - name: Copy runtime DLLs and configs
      run: |
        $srcDir = "GB28181DeviceSimulator\GB28181DeviceSimulator"
        $outDir = "Release_x64"
        
        New-Item -ItemType Directory -Force -Path $outDir
        
        # 复制所有运行时依赖 DLL
        $dllFiles = @(
            "libEasyGBD.dll",
            "libEasyStreamClient.dll",
            "libEasyAACEncoder.dll",
            "libeasyrtmp.dll",
            "Logger.dll",
            "avcodec-58.dll",
            "avdevice-58.dll",
            "avfilter-7.dll",
            "avformat-58.dll",
            "avutil-56.dll",
            "postproc-55.dll",
            "swresample-3.dll",
            "swscale-5.dll",
            "concrt140.dll"
        )
        
        foreach ($dll in $dllFiles) {
            $fullPath = Join-Path $srcDir $dll
            if (Test-Path $fullPath) {
                Copy-Item $fullPath $outDir\ -Force
                Write-Host "Copied: $dll"
            } else {
                Write-Host "WARNING: $dll not found"
            }
        }
        
        # 复制配置和视频文件
        Copy-Item "$srcDir\EasyDarwin.mp4" $outDir\ -Force
        Copy-Item "$srcDir\GB28181Device.xml" $outDir\ -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EasyGBDSimulator
        path: Release_x64/
