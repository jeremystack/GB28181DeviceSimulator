name: Build GB28181DeviceSimulator

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build with MSBuild
      run: |
        # 源码只在工作区根目录下的一层 GB28181DeviceSimulator 中
        $srcDir = "GB28181DeviceSimulator"
        
        Push-Location $srcDir
        msbuild GB28181DeviceSimulator.vcxproj `
          /p:Configuration=Release `
          /p:Platform=x64
        if ($LASTEXITCODE -ne 0) {
            Write-Error "MSBuild failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
        }
        Pop-Location
        
        # MSBuild 默认输出到 srcDir\x64\Release
        $buildOutDir = Join-Path $srcDir "x64\Release"
        $finalDir = "$env:GITHUB_WORKSPACE\Release_x64"
        
        New-Item -ItemType Directory -Force -Path $finalDir | Out-Null
        
        # 复制编译产物（实际链接器输出名为 EasyGBDSimulator.exe）
        Copy-Item "$buildOutDir\EasyGBDSimulator.exe" $finalDir\ -Force
        if (Test-Path "$buildOutDir\GB28181DeviceSimulator.pdb") {
            Copy-Item "$buildOutDir\GB28181DeviceSimulator.pdb" $finalDir\ -Force
        }
        
        Write-Host "=== Copied build output ==="
        Get-ChildItem $finalDir | Select-Object Name, Length

    - name: Copy runtime DLLs and configs
      run: |
        $srcDir = "GB28181DeviceSimulator"
        $outDir = "$env:GITHUB_WORKSPACE\Release_x64"
        
        $dllFiles = @(
            "libEasyGBD.dll",
            "libEasyStreamClient.dll",
            "libEasyAACEncoder.dll",
            "libeasyrtmp.dll",
            "Logger.dll",
            "avcodec-58.dll",
            "avdevice-58.dll",
            "avfilter-7.dll",
            "avformat-58.dll",
            "avutil-56.dll",
            "postproc-55.dll",
            "swresample-3.dll",
            "swscale-5.dll",
            "concrt140.dll"
        )
        
        foreach ($dll in $dllFiles) {
            $fullPath = Join-Path $srcDir $dll
            if (Test-Path $fullPath) {
                Copy-Item $fullPath $outDir\ -Force
                Write-Host "Copied: $dll"
            } else {
                Write-Host "WARNING: $dll not found at $fullPath"
            }
        }
        
        @("EasyDarwin.mp4", "GB28181Device.xml") | ForEach-Object {
            $fp = Join-Path $srcDir $_
            if (Test-Path $fp) {
                Copy-Item $fp $outDir\ -Force
                Write-Host "Copied: $_"
            } else {
                Write-Host "WARNING: $_ not found"
            }
        }
        
        Write-Host "`n=== Final Release_x64 contents ==="
        Get-ChildItem $outDir | Select-Object Name, Length | Format-Table -AutoSize

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EasyGBDSimulator
        path: ${{ github.workspace }}\Release_x64\
        if-no-files-found: error
